approval_policy = "never"

[features]
shell_snapshot = false

[shell_environment_policy]
inherit = "none"
include_only = ["PATH", "HOME", "TMPDIR", "SCOUT_RUN_ID", "SCOUT_RUN_ROOT", "SCOUT_ARTIFACT_ROOT", "SCOUT_ASSET_COMMIT_ID", "SCOUT_UNDERSTANDING_THREAD_ID", "GIT_OPTIONAL_LOCKS", "GIT_CONFIG_GLOBAL", "GIT_CONFIG_NOSYSTEM"]
